# Local Supabase config. For hosted projects, mirror SMTP + redirect URLs in the Supabase Dashboard.
project_id = "capsood-fuel-report"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/reset-password",
  "http://localhost:3000/reset-password?recovery=1",
  "http://127.0.0.1:3000/reset-password",
  "http://127.0.0.1:3000/reset-password?recovery=1",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=/reset-password?recovery=1",
  "http://127.0.0.1:3000/auth/callback?next=/reset-password?recovery=1",
  "http://localhost:3000/auth/callback?next=%2Freset-password%3Frecovery%3D1",
  "http://127.0.0.1:3000/auth/callback?next=%2Freset-password%3Frecovery%3D1"
]

[auth.email]
enable_signup = true

[auth.email.smtp]
enabled = true
host = "env(SUPABASE_SMTP_HOST)"
port = 587
user = "env(SUPABASE_SMTP_USER)"
pass = "env(SUPABASE_SMTP_PASS)"
admin_email = "env(SUPABASE_SMTP_ADMIN_EMAIL)"
sender_name = "Capsood Fuel Report"

[auth.email.template.recovery]
subject = "Your Capsood Fuel Report password reset code"
content_path = "./supabase/templates/recovery.html"
